<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapGIS Bello - Inicio</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .header { 
            position: absolute; top: 10px; left: 50px; 
            z-index: 1000; background: white; 
            padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MapGIS Bello (Beta)</h1>
        <p>Iniciando visor geográfico</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicializar mapa centrado en Bello, Antioquia
        var map = L.map('map').setView([6.3373, -75.5579], 15);

        // Cargar capa de mapa gratuita (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Marcador en el parque principal
        L.marker([6.3373, -75.5579]).addTo(map)
            .bindPopup('Parque Principal de Bello')
            .openPopup();
    </script>
</body>
</html>
